name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Unzip Project Files
      run: unzip JAVA.zip -d .

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with Gradle
      run: |
        # জিপের ভেতরে যদি আলাদা ফোল্ডার থাকে, তার ভেতরে ঢোকার জন্য
        if [ -d "JAVA" ]; then cd JAVA; fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
